<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CensorLicensePlate — license plate region censor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --surface: #171b22;
        --border: #2a3038;
        --fg: #e6e9ee;
        --muted: #9aa4b2;
        --accent: #4ade80;
        --accent-fg: #06240f;
        --error: #f87171;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --border: #d7dce3;
        --fg: #14181f;
        --muted: #5c6672;
        --accent: #15803d;
        --accent-fg: #ffffff;
        --error: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 3rem;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 640px;
        margin: auto;
        text-align: center;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
      }
      .controls button {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--fg);
        border-radius: 8px;
        padding: 0.35rem 0.75rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: border-color 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .controls button:hover {
        border-color: var(--accent);
      }
      p.lead {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
        margin: 1rem auto 1.75rem;
        max-width: 540px;
        text-align: center;
      }
      form {
        display: grid;
        gap: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        text-align: center;
      }
      form label[for="file"] {
        font-size: 0.925rem;
        font-weight: 500;
      }
      input[type="file"] {
        color: var(--fg);
        margin: 0 auto;
        max-width: 100%;
        font: inherit;
        font-size: 0.875rem;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        margin: 0;
      }
      legend {
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0 0.4rem;
      }
      fieldset label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0;
        font-size: 0.925rem;
        cursor: pointer;
      }
      button[type="submit"] {
        justify-self: center;
        padding: 0.65rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.05s ease;
      }
      button[type="submit"]:hover {
        opacity: 0.95;
      }
      button[type="submit"]:active {
        transform: scale(0.98);
      }
      button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: progress;
        transform: none;
      }
      .status {
        color: var(--muted);
        min-height: 1.4em;
        font-size: 0.875rem;
      }
      .status.error {
        color: var(--error);
      }
      figure {
        margin: 1.75rem 0 0;
      }
      figure img {
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: block;
      }
      figcaption {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.6rem;
        text-align: center;
      }
      footer {
        color: var(--muted);
        font-size: 0.8125rem;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        text-align: center;
      }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="bar">
        <h1>CensorLicensePlate</h1>
        <div class="controls">
          <button id="lang" type="button">ID</button>
          <button id="theme" type="button">☀</button>
        </div>
      </header>

      <p class="lead" data-i18n="lead"></p>

      <form id="upload">
        <label for="file" data-i18n="fileLabel"></label>
        <input id="file" name="file" type="file" accept="image/*" required />
        <fieldset>
          <legend data-i18n="modeLegend"></legend>
          <label>
            <input type="radio" name="mode" value="censor" checked />
            <span data-i18n="modeCensor"></span>
          </label>
          <label>
            <input type="radio" name="mode" value="highlight" />
            <span data-i18n="modeHighlight"></span>
          </label>
        </fieldset>
        <button id="submit" type="submit" data-i18n="submit"></button>
        <output class="status" id="status"></output>
      </form>

      <figure hidden id="result">
        <img id="preview" data-i18n-alt="previewAlt" alt="" />
        <figcaption>
          <a id="download" download="censor-license-plate.png" data-i18n="download"></a>
        </figcaption>
      </figure>

      <footer>
        <span>© 2026 Fazri Gading</span>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/fazrigading/censor-license-plate/blob/master/LICENSE" data-i18n="license"></a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/fazrigading/censor-license-plate">GitHub</a>
      </footer>
    </main>

    <script>
      const I18N = {
        en: {
          title: "CensorLicensePlate — license plate region censor",
          lead:
            "Finds the license plate or traffic sign region of a photo with OpenCV. " +
            "Censor blurs that region so the plate cannot be read; Highlight keeps it " +
            "sharp and blurs everything else.",
          fileLabel: "Pick a vehicle photo (JPG or PNG, up to 8 MB)",
          modeLegend: "Mode",
          modeCensor: "Censor the plate (region blurred)",
          modeHighlight: "Show the plate (surroundings blurred)",
          submit: "Process",
          download: "Download result",
          license: "MIT License",
          previewAlt: "Result of the plate region detection",
          processing: "Processing…",
          done: "Done.",
          failed: "Failed: ",
          themeToLight: "Switch to light theme",
          themeToDark: "Switch to dark theme",
          themeIcon: "☀",
          langLabel: "Ganti ke Bahasa Indonesia",
        },
        id: {
          title: "CensorLicensePlate — sensor region plat nomor",
          lead:
            "Mendeteksi region plat nomor atau rambu dari sebuah foto dengan OpenCV. " +
            "Mode censor memblur region itu supaya plat tidak terbaca; mode highlight " +
            "mempertajamnya dan memblur sisanya.",
          fileLabel: "Pilih foto kendaraan (JPG atau PNG, maksimal 8 MB)",
          modeLegend: "Mode",
          modeCensor: "Sensor plat nomor (region diblur)",
          modeHighlight: "Tampilkan plat nomor (sekitar diblur)",
          submit: "Proses",
          download: "Unduh hasil",
          license: "Lisensi MIT",
          previewAlt: "Hasil deteksi region plat nomor",
          processing: "Memproses…",
          done: "Selesai.",
          failed: "Gagal: ",
          themeToLight: "Ganti ke tema terang",
          themeToDark: "Ganti ke tema gelap",
          themeIcon: "☀",
          langLabel: "Switch to English",
        },
      };

      const form = document.getElementById("upload");
      const fileInput = document.getElementById("file");
      const status = document.getElementById("status");
      const figure = document.getElementById("result");
      const preview = document.getElementById("preview");
      const download = document.getElementById("download");
      const button = document.getElementById("submit");
      const langButton = document.getElementById("lang");
      const themeButton = document.getElementById("theme");
      const root = document.documentElement;

      let lang = localStorage.getItem("lang") || "en";
      let theme = localStorage.getItem("theme");
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      let objectUrl = null;

      const t = (key) => I18N[lang][key];

      function applyLang() {
        root.lang = lang;
        document.title = t("title");
        for (const node of document.querySelectorAll("[data-i18n]")) {
          node.textContent = t(node.dataset.i18n);
        }
        for (const node of document.querySelectorAll("[data-i18n-alt]")) {
          node.alt = t(node.dataset.i18nAlt);
        }
        langButton.textContent = lang === "en" ? "🇮🇩 ID" : "🇬🇧 EN";
        langButton.setAttribute("aria-label", t("langLabel"));
        langButton.title = t("langLabel");
      }

      function applyTheme() {
        root.dataset.theme = theme;
        const dark = theme === "dark";
        themeButton.textContent = dark ? "☀" : "☾";
        themeButton.setAttribute("aria-label", dark ? t("themeToLight") : t("themeToDark"));
        themeButton.title = dark ? t("themeToLight") : t("themeToDark");
      }

      langButton.addEventListener("click", () => {
        lang = lang === "en" ? "id" : "en";
        localStorage.setItem("lang", lang);
        applyLang();
      });

      themeButton.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        localStorage.setItem("theme", theme);
        applyTheme();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        status.className = "status";
        status.textContent = t("processing");
        button.disabled = true;

        try {
          const mode = form.elements.mode.value;
          const response = await fetch(`/api/segment?mode=${encodeURIComponent(mode)}`, {
            method: "POST",
            headers: { "content-type": "application/octet-stream" },
            body: file,
          });
          if (!response.ok) {
            throw new Error((await response.text()) || `HTTP ${response.status}`);
          }
          objectUrl = URL.createObjectURL(await response.blob());
          preview.src = objectUrl;
          download.href = objectUrl;
          download.download = `${mode}-${file.name.replace(/\.[^.]+$/, "")}.png`;
          figure.hidden = false;
          status.textContent = t("done");
        } catch (error) {
          status.className = "status error";
          status.textContent = t("failed") + error.message;
        } finally {
          button.disabled = false;
        }
      });

      applyLang();
      applyTheme();
    </script>
  </body>
</html>
