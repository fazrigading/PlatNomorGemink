<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlatNomorGemink — segmentasi plat nomor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --surface: #171b22;
        --border: #2a3038;
        --fg: #e6e9ee;
        --muted: #9aa4b2;
        --accent: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 3rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      form {
        display: grid;
        gap: 0.75rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      input[type="file"] {
        color: var(--fg);
      }
      button {
        justify-self: start;
        padding: 0.55rem 1.1rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #06240f;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      .status {
        color: var(--muted);
        min-height: 1.4em;
      }
      .status.error {
        color: #f87171;
      }
      figure {
        margin: 1.5rem 0 0;
      }
      figure img {
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: block;
      }
      figcaption {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.4rem;
      }
      footer {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 2rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PlatNomorGemink</h1>
      <p class="lead">
        Deteksi region plat nomor / rambu secara otomatis. Region yang terdeteksi tetap tajam,
        sisanya diblur.
      </p>

      <form id="upload">
        <label for="file">Pilih foto kendaraan (JPG atau PNG, maksimal 8 MB)</label>
        <input id="file" name="file" type="file" accept="image/*" required />
        <button id="submit" type="submit">Proses</button>
        <output class="status" id="status"></output>
      </form>

      <figure hidden id="result">
        <img id="preview" alt="Hasil segmentasi region plat nomor" />
        <figcaption>
          <a id="download" download="platnomor.png">Unduh hasil</a>
        </figcaption>
      </figure>

      <footer>
        Pipeline Python ada di <code>platnomor/</code>, endpoint Vercel di
        <code>api/segment.py</code>.
      </footer>
    </main>

    <script>
      const form = document.getElementById("upload");
      const status = document.getElementById("status");
      const figure = document.getElementById("result");
      const preview = document.getElementById("preview");
      const download = document.getElementById("download");
      const button = document.getElementById("submit");
      let objectUrl = null;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = document.getElementById("file").files[0];
        if (!file) return;

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        status.className = "status";
        status.textContent = "Memproses…";
        button.disabled = true;

        try {
          const response = await fetch("/api/segment", {
            method: "POST",
            headers: { "content-type": "application/octet-stream" },
            body: file,
          });
          if (!response.ok) {
            throw new Error((await response.text()) || `HTTP ${response.status}`);
          }
          objectUrl = URL.createObjectURL(await response.blob());
          preview.src = objectUrl;
          download.href = objectUrl;
          figure.hidden = false;
          status.textContent = "Selesai.";
        } catch (error) {
          status.className = "status error";
          status.textContent = `Gagal: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
