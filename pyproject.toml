[project]
name = "censor-license-plate"
version = "0.1.0"
description = "Segment the licence plate and traffic sign region of a vehicle photo with OpenCV"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[tool.vercel]
entrypoint = "api.segment:handler"
